services:
  app:
    build:
      context: . 
      dockerfile: Dockerfile
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql+psycopg2://postgres:postgres@database:5432/app}
      ENVIRONMENT: ${ENVIRONMENT:-DEVELOPMENT}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-24}
      STORAGE_SECRET: ${STORAGE_SECRET}
    restart: unless-stopped
    ports:
      - 8000:8000
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18.6-alpine3.24
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d/
      - db_volume:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-app}
    ports:
      - ${DATABASE_PORT:-5432}:5432
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -d ${DATABASE_NAME:-postgres} -U ${DATABASE_USER:-postgres}"]
          interval: 5s
          timeout: 5s
          retries: 1

volumes:
  db_volume:
